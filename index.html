<title>Scout Studio Scouting</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@600;700&family=Open+Sans:wght@300;400;700&display=swap">
<style>
/* Concepto: consola de scouting sobre azul Scout Studio; hexágono como motivo (avatares, viñetas, portada). Jost reemplaza a Neue Kabel Bold en la web. */
:root{
  --bg:#F3F5FF; --panel:#FFFFFF; --panel2:#E8ECFF; --fg:#00007C; --muted:#4B4F9E; --line:#C9D0F5;
  --accent:#0000C4; --accent2:#3857FF; --cel:#39A0FF; --on-accent:#FFFFFF; --good:#0B8A4B; --bad:#C62828;
  --head:'Jost','Century Gothic','Futura',sans-serif; --body:'Open Sans','Segoe UI',Arial,sans-serif;
  --logo-w:none; --logo-n:block;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#00007C; --panel:#0A0A94; --panel2:#00006A; --fg:#FFFFFF; --muted:#A9C8FF; --line:#2B3BC9;
  --accent:#39A0FF; --accent2:#7FB9FF; --on-accent:#00007C; --good:#6FE3A3; --bad:#FF8A8A; --logo-w:block; --logo-n:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#00007C; --panel:#0A0A94; --panel2:#00006A; --fg:#FFFFFF; --muted:#A9C8FF; --line:#2B3BC9;
  --accent:#39A0FF; --accent2:#7FB9FF; --on-accent:#00007C; --good:#6FE3A3; --bad:#FF8A8A; --logo-w:block; --logo-n:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:300;font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
b,strong,th{font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 8px;flex-wrap:wrap}
.brand-eyebrow{font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.logo{height:26px;width:auto}
.logo.w{display:var(--logo-w)} .logo.n{display:var(--logo-n)}
.title{font-size:clamp(40px,8vw,76px);line-height:.95;margin:6px 0 4px}
.title i{font-style:normal;color:var(--accent)}
.sub{color:var(--muted);max-width:60ch;margin:0 0 20px}
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--accent);background:transparent;color:var(--fg);padding:10px 16px;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:0}
.btn:hover{background:var(--panel2)}
.btn.on,.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:6px 10px;font-size:11px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr.row:focus-visible{outline:2px solid var(--cel);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--line);padding:18px}
.filters{display:grid;gap:14px}
details.ms{position:relative}details.ms>summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--card,#fff);padding:9px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;min-height:38px;align-items:center}
details.ms>summary::-webkit-details-marker{display:none}details.ms>summary::after{content:'▾';opacity:.6}
details.ms .msb{position:absolute;z-index:30;left:0;right:0;min-width:220px;max-height:300px;overflow:auto;background:var(--card,#fff);border:1px solid var(--accent2,#3857FF);padding:6px;box-shadow:0 8px 24px rgba(0,0,124,.18)}
details.ms .msb label{display:flex;gap:8px;align-items:center;padding:5px 6px;font-size:13px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400}details.ms .msb label:hover{background:rgba(57,160,255,.12)}details.ms .msb input[type=checkbox]{width:auto}
details.ms .msb input.mss{width:100%;margin-bottom:6px}
[contenteditable=true]{outline:1px dashed rgba(57,160,255,.0);cursor:text}[contenteditable=true]:hover{outline-color:#39A0FF;background:rgba(57,160,255,.08)}[contenteditable=true]:focus{outline:2px solid #3857FF;background:rgba(57,160,255,.12)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);padding:9px 10px;font-weight:400;font-size:14px;width:100%;border-radius:0;color:var(--fg)}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .lbl{font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.count{color:var(--muted);margin:16px 0 8px;font-size:13px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;text-align:left;padding:10px 12px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer} tr.row:hover td{background:var(--panel2)}
td.num,th.num{text-align:right}
.pl{display:flex;align-items:center;gap:12px;min-width:0}
.pl b{display:block;font-weight:700} .pl small{color:var(--muted);font-size:12px}
.hex{width:44px;height:48px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--accent2);display:grid;place-items:center;color:#fff;font-family:var(--head);font-weight:700;font-size:15px;overflow:hidden}
.hex img{width:100%;height:100%;object-fit:cover;display:block}
.hex.lg{width:120px;height:132px;font-size:36px}
.idx{display:inline-block;min-width:40px;text-align:center;padding:3px 8px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:2px 8px;color:var(--muted)}
.star{cursor:pointer;background:none;border:0;font-size:18px;color:var(--cel);padding:2px 6px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.stat{background:var(--panel);border:1px solid var(--line);padding:12px 14px}
.stat b{display:block;font-family:var(--head);font-size:30px;line-height:1}
.stat span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0}
dl.kv dt,dl.kv dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line)}
dl.kv dt{font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-right:20px}
.bar{height:8px;background:var(--panel2);position:relative}.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.metric{display:grid;grid-template-columns:minmax(0,1.4fr) 70px minmax(60px,1fr) 34px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.callout{background:var(--accent);color:var(--on-accent);padding:16px 18px}
.callout h3{font-size:13px;margin-bottom:6px}
.empty{padding:40px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,40,.7);z-index:50;display:grid;place-items:start center;overflow:auto;padding:24px 12px}
.modal .box{background:var(--panel);border:1px solid var(--line);width:min(900px,100%);padding:22px}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:10px 18px;font-weight:700;z-index:80}
.cmpbar{background:var(--accent2)!important}.cmpbar .btn:disabled{opacity:.5}.cmpbar .btn.primary{color:var(--accent2)!important}#selbar{position:fixed;left:0;right:0;bottom:0;z-index:40}.sticky-sel{background:var(--accent);color:var(--on-accent);padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.sticky-sel .btn{border-color:var(--on-accent);color:var(--on-accent)} .sticky-sel .btn.primary{background:var(--on-accent);color:var(--accent)}
/* informe */
.rbuilder{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:900px){.rbuilder{grid-template-columns:1fr}}
.opts{display:grid;gap:14px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.chk input{width:auto}
.pick{max-height:300px;overflow:auto;border:1px solid var(--line);background:var(--bg)}
.pick label{display:flex;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.pick input{width:auto}
.slidewrap{position:relative;width:100%;aspect-ratio:16/9;margin-bottom:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
.slide{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;font-family:var(--body);color:#00007C;background:#fff;overflow:hidden}
.slide *{box-sizing:border-box}
.slide .abs{position:absolute}
.slide .h{font-family:var(--head);font-weight:700;text-transform:uppercase}
.slide.navy{background:#00007C;color:#fff}
.slide table{min-width:0;width:100%}
.slide td,.slide th{padding:0 8px;border:0;border-bottom:1px solid #C9D0F5;color:#00007C;font-size:15px}
.slide th{background:#00007C;color:#fff;font-size:12px;border:0}
.slide .ph{border-radius:50%;object-fit:cover;display:block}
.slide .card{border:1px solid #C9D0F5;background:#F3F5FF;padding:8px 10px}
.slide .card b{display:block;font-family:var(--head);font-size:26px;line-height:1.1}
.slide .card span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#4B4F9E}
.small{font-size:12px;color:var(--muted)}
.simrow{display:grid;grid-template-columns:22px 44px minmax(0,1fr) minmax(110px,170px);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.simrow input[type=checkbox]{width:auto}
.simname{font-family:var(--body);font-weight:700;font-size:15px;color:var(--fg);background:none;border:0;padding:0;text-align:left;cursor:pointer}
.simname:hover{text-decoration:underline}
.simwhy{font-size:12px;color:var(--muted);line-height:1.45}
.simwhy .ok{color:var(--good);font-weight:700}
.simpct{display:flex;align-items:center;gap:10px}.simpct .bar{flex:1}
.simpct b{font-family:var(--head);font-size:22px;min-width:48px;text-align:right}
input[type=range]{padding:0;accent-color:var(--accent2)}
@media(max-width:620px){.simrow{grid-template-columns:22px 44px minmax(0,1fr)}.simrow .simpct{grid-column:2/-1}}
.hide-m{} @media(max-width:700px){.hide-m{display:none}}

#drawer{position:fixed;left:0;top:0;bottom:0;width:290px;max-width:86vw;background:var(--panel);border-right:1px solid var(--line);z-index:60;transform:translateX(-102%);transition:transform .22s ease;padding:16px;display:flex;flex-direction:column;gap:4px;overflow:auto}
#drawer.open{transform:none;box-shadow:6px 0 30px rgba(0,0,60,.25)}
#dscrim{position:fixed;inset:0;background:rgba(0,0,40,.35);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
#dscrim.open{opacity:1;pointer-events:auto}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:var(--head);font-size:20px;text-transform:uppercase}
.ditem{display:block;padding:11px 12px;color:var(--fg);text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;border-left:3px solid transparent}
.ditem:hover{background:var(--panel2)} .ditem.on{border-left-color:var(--accent);background:var(--panel2)}
.dsep{height:1px;background:var(--line);margin:10px 0}
body.is-portada .top,body.is-portada .title,body.is-portada nav.tabs{display:none}
.curtab{align-self:center;font-family:var(--head);font-size:18px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cover{position:relative;background:#00007C;color:#fff;min-height:calc(100vh - 56px);padding:clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.cvmenu{position:absolute;left:clamp(16px,3vw,32px);top:clamp(16px,3vw,32px);border-color:#fff;color:#fff}
.cvlogo{position:absolute;right:clamp(16px,5vw,64px);top:clamp(20px,5vw,56px);width:clamp(150px,24vw,300px)}
.cvbody{margin-top:60px}
.cveyebrow{font-size:13px;letter-spacing:.2em;font-weight:700;color:#39A0FF;text-transform:uppercase;margin-bottom:12px}
.cvtitle{font-family:var(--head);font-weight:700;text-transform:uppercase;font-size:clamp(44px,9vw,92px);line-height:1;margin:0 0 26px;max-width:900px}
.cvsub{font-size:clamp(18px,2.6vw,26px);color:#39A0FF;font-weight:300;margin-bottom:12px}
.cvline{font-size:clamp(14px,1.6vw,18px);font-weight:300}
.cvfoot{position:absolute;left:clamp(24px,5vw,64px);bottom:clamp(16px,3vw,32px);font-size:12px;letter-spacing:.1em;opacity:.8}
#chFab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + var(--selh,0px) + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:0;box-shadow:0 6px 20px rgba(0,0,100,.35);display:grid;place-items:center;cursor:pointer;z-index:60;padding:0}
#chFab.on{background:var(--accent2)}
#chPanel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(86px + var(--selh,0px) + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 32px));height:min(600px,calc(100vh - 120px));background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,100,.3);display:flex;flex-direction:column;z-index:60}
.chhd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--accent);color:var(--on-accent);font-family:var(--head)}
.chhd button{background:none;border:0;color:inherit;cursor:pointer;font-size:13px;padding:2px 6px}
#chMsgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.chu{align-self:flex-end;background:var(--accent2);color:#fff;padding:8px 12px;max-width:88%;font-weight:400}
.cha{align-self:flex-start;background:var(--panel2);padding:8px 12px;max-width:100%;line-height:1.45;font-weight:400}
.cha p{margin:0 0 6px}.cha p:last-child{margin:0}.cha ul{margin:4px 0 6px 18px;padding:0}
.chst{color:var(--muted);font-style:italic}
.chhint{color:var(--muted);font-size:12.5px}.chchips{display:flex;flex-direction:column;gap:6px}
.chchip{text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:8px 10px;font-size:12.5px;cursor:pointer}
.chlink{color:var(--accent2);font-weight:700;text-decoration:underline}
.chtab{overflow-x:auto;margin:4px 0}.chtab table{font-size:12px;border-collapse:collapse;width:100%}.chtab th,.chtab td{padding:4px 7px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}.chtab th{font-size:10px}
.chft{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}.chft input{flex:1}
@media(max-width:700px){#chPanel{right:8px;left:8px;width:auto;bottom:calc(80px + env(safe-area-inset-bottom,0px))}}
/* filtro por métricas con barras deslizables */
.metbox{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.metrow{display:grid;grid-template-columns:minmax(150px,1.1fr) 104px minmax(160px,2fr) 130px 34px;gap:12px;align-items:center}
.metname{font-weight:700;font-size:13px}
.dual{position:relative;height:28px}
.dual input[type=range]{position:absolute;left:0;right:0;top:0;width:100%;height:28px;margin:0;padding:0;border:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line)}
.dual input[type=range]::-moz-range-track{height:4px;background:var(--line)}
.dual input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--accent2);border:2px solid var(--panel);margin-top:-6px;cursor:pointer}
.dual input[type=range]::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:var(--accent2);border:2px solid var(--panel);cursor:pointer}
.metval{font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
@media(max-width:700px){.metrow{grid-template-columns:1fr 1fr 34px}.metrow .dual,.metrow .metval{grid-column:1/-1}}
/* ===================== REDISEÑO 2026-11 · barra superior, ficha tipo FotMob, movimiento ===================== */
:root{--side:#00007C;--side2:#0A0A94;--sideline:#1F2BB0;--sidemuted:#A9C8FF;--mid:#9BA6E8;--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme="dark"]{--side:#000050;--side2:#00006A;--sideline:#1A2299;--mid:#5C6BE0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--side:#000050;--side2:#00006A;--sideline:#1A2299;--mid:#5C6BE0}}
body{margin:0;padding-left:0;padding-right:0;transition:background .35s,color .35s}
:root{--card:var(--panel)}
.wrap{padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.panel,.stat,.tablewrap,input,select,textarea,td,th{transition:background .35s,border-color .35s,color .35s}

/* barra superior */
.topbar{position:sticky;top:0;z-index:45;display:flex;align-items:center;gap:18px;height:58px;padding:0 max(16px,env(safe-area-inset-left,0px));background:var(--side);color:#fff;border-bottom:1px solid var(--sideline);margin-bottom:22px}
.brand{display:flex;align-items:center;flex:none;height:100%}
.tlogo{height:22px;width:auto;display:block;transition:transform .3s var(--ease)}
.brand:hover .tlogo{transform:scale(1.05)}
.tnav{position:relative;display:flex;height:100%;gap:0;margin:0;flex-wrap:nowrap}
.tnav button{position:relative;background:none;border:0;color:var(--sidemuted);padding:0 12px;height:100%;font-weight:700;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:color .2s}
.tnav button:hover,.tnav button.on{color:#fff}
.tnav button sup{font-size:9px;color:var(--cel);margin-left:3px;letter-spacing:0}
.tnav .ind{position:absolute;bottom:0;left:0;height:3px;width:0;background:var(--cel);transition:transform .35s var(--ease),width .35s var(--ease);pointer-events:none}
.tcur{display:none;font-family:var(--head);font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--sidemuted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsearch{margin-left:auto;position:relative;width:min(300px,26vw);display:block}
.tsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.7;color:#fff}
.tsearch input{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--sideline);color:#fff;padding:8px 32px 8px 32px;font-size:13px;outline:none;transition:background .2s,border-color .2s,box-shadow .2s}
.tsearch input::placeholder{color:var(--sidemuted)}
.tsearch input:focus{border-color:var(--cel);background:rgba(255,255,255,.14);box-shadow:0 0 0 3px rgba(57,160,255,.22)}
.tsearch kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;border:1px solid var(--sideline);padding:1px 5px;color:var(--sidemuted);font-family:var(--body)}
.iconbtn{flex:none;background:none;border:1px solid var(--sideline);color:#fff;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;padding:0;transition:border-color .2s,transform .2s}
.iconbtn:hover{border-color:var(--cel);transform:translateY(-1px)}
.tmenu{display:none}
#bTheme .i-moon{display:none}
:root[data-theme="dark"] #bTheme .i-sun{display:none}:root[data-theme="dark"] #bTheme .i-moon{display:block}
#bTheme svg{animation:spinIn .45s var(--ease)}
@media(max-width:1180px){.tnav{display:none}.tmenu{display:grid}.tcur{display:block;flex:1}.tsearch{width:min(260px,38vw)}}
@media(max-width:620px){.tsearch kbd{display:none}.tsearch{width:42px}.tsearch input{padding-right:6px;color:transparent}.tsearch input:focus{position:fixed;left:12px;right:12px;top:11px;width:auto;color:#fff;z-index:2}.tlogo{height:18px}}

/* tarjetas: luz que sigue al mouse y elevación */
.panel,.stat,.pcard{position:relative}
.panel::before,.stat::before,.pcard::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(57,160,255,.11),transparent 45%)}
.panel:hover::before,.stat:hover::before,.pcard:hover::before{opacity:1}
.stat{transition:transform .25s var(--ease),box-shadow .25s,background .35s,border-color .35s}
.stat:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,124,.12)}

/* botones: onda al hacer clic */
.btn{position:relative;overflow:hidden;transition:background .2s,color .2s,transform .15s,filter .2s}
.btn:active{transform:scale(.97)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:ripple .55s ease-out forwards;pointer-events:none}

/* entrada de cada vista */
#main.vin>*{animation:rise .45s var(--ease) both}
#main.vin>*:nth-child(2){animation-delay:.06s}#main.vin>*:nth-child(3){animation-delay:.12s}#main.vin>*:nth-child(4){animation-delay:.18s}#main.vin>*:nth-child(n+5){animation-delay:.22s}

/* chips de filtros activos */
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 9px;background:rgba(57,160,255,.13);border:1px solid rgba(57,160,255,.45);color:var(--fg);cursor:pointer;animation:pop .3s var(--ease) both;transition:background .2s}
.fchip:hover{background:rgba(57,160,255,.25)}
.fchip i{font-style:normal;color:var(--muted);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.fchip .x{opacity:.6;font-weight:700}.fchip:hover .x{opacity:1}
.fchip.clr{background:none;border-style:dashed;color:var(--muted)}

/* listado */
#results tbody tr.row{animation:rise .35s var(--ease) both;animation-delay:calc(var(--i,0) * 18ms)}
tr.row td{transition:background .15s}
tr.row:hover .hex{transform:scale(1.08) rotate(-4deg)}
.hex{transition:transform .3s var(--ease)}
.idx.t4{background:var(--good);color:#fff}.idx.t3{background:var(--accent2);color:#fff}.idx.t2{background:var(--mid);color:#00007C}.idx.t1{background:var(--bad);color:#fff}

/* ficha: cabecera tipo FotMob */
.fhero{position:relative;overflow:hidden;background:var(--accent);color:#fff;padding:24px 26px 22px;margin-bottom:16px}
:root[data-theme="dark"] .fhero{background:#0000C4}
.fhero::after{content:'';position:absolute;right:-70px;top:-50px;width:340px;height:370px;background:rgba(57,160,255,.2);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);animation:floatA 9s ease-in-out infinite}
.fhero::before{content:'';position:absolute;right:220px;bottom:-90px;width:160px;height:176px;background:rgba(255,255,255,.07);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);animation:floatB 11s ease-in-out infinite}
.fhero .in{position:relative;z-index:1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center}
.fhero .hex.lg{background:var(--cel);color:#00007C;animation:pop .6s var(--ease) both}
.fhero .brand-eyebrow{color:var(--cel)}
.fhero h2{font-size:clamp(28px,4.6vw,46px);line-height:1;margin:6px 0 10px;animation:typeIn .7s .1s var(--ease) both}
.fhero .meta{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:13.5px;opacity:.95}
.fhero .meta span{display:inline-flex;align-items:center;gap:7px}
.fhero .meta span+span::before{content:'';width:4px;height:4px;background:var(--cel)}
.fhero .sub{margin:8px 0 0;font-size:12.5px;color:#fff;opacity:.8}
.bigidx{text-align:center;border:1.5px solid rgba(255,255,255,.5);padding:10px 18px;min-width:120px;animation:glowBorder 3s ease-in-out infinite}
.bigidx b{display:block;font-family:var(--head);font-size:46px;line-height:1}
.bigidx span{font-size:10px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;opacity:.85}
.fnav{display:flex;gap:6px;justify-content:center;margin-top:10px}
.fnav button{background:none;border:1px solid rgba(255,255,255,.55);color:#fff;width:32px;height:28px;cursor:pointer;font-size:15px;line-height:1}
.fnav button:hover:not([disabled]){background:rgba(255,255,255,.14)}
.fnav button[disabled]{opacity:.3;cursor:default}
.fnav small{align-self:center;font-size:11px;opacity:.75;min-width:52px;text-align:center}
.factions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.factions .sp{flex:1}
@media(max-width:760px){.fhero .in{grid-template-columns:auto minmax(0,1fr)}.fhero .bigside{grid-column:1/-1;display:flex;gap:14px;align-items:center}.fhero .hex.lg{width:84px;height:92px;font-size:28px}.fnav{margin:0}}

/* barras de percentil por nivel */
.bar i{animation:grow .9s var(--ease) both;animation-delay:calc(var(--d,0) * 25ms)}
.bar i.t4{background:var(--good)}.bar i.t3{background:var(--accent2)}.bar i.t2{background:var(--mid)}.bar i.t1{background:var(--bad)}
.metric{transition:background .15s}
.metric:hover{background:var(--panel2)}
.metric .pv{font-family:var(--head);font-size:15px;text-align:right}
.pv.t4{color:var(--good)}.pv.t1{color:var(--bad)}
.tierleg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:4px 0 6px}
.tierleg span{display:inline-flex;align-items:center;gap:6px}.tierleg i{width:14px;height:6px;display:inline-block}

/* portada */
.cover{margin:-22px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;min-height:calc(100vh - 58px);background:radial-gradient(1200px 600px at 85% 10%,#0A0A94,transparent 60%),#00007C}
.cover .cvgrid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#39A0FF 1px,transparent 1px),linear-gradient(90deg,#39A0FF 1px,transparent 1px);background-size:60px 52px;animation:drift 18s linear infinite;pointer-events:none}
.cover .hx{position:absolute;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);pointer-events:none}
.cover .hx.a{width:340px;height:374px;right:6%;top:14%;background:rgba(57,160,255,.16);animation:floatA 10s ease-in-out infinite}
.cover .hx.b{width:200px;height:220px;right:28%;bottom:10%;background:rgba(56,87,255,.22);animation:floatB 12s ease-in-out infinite}
.cover .hx.c{width:90px;height:99px;right:12%;bottom:22%;background:rgba(255,255,255,.08);animation:floatA 8s ease-in-out infinite reverse}
.cover .hx.d{width:60px;height:66px;left:52%;top:18%;border:0;background:rgba(57,160,255,.3);animation:floatB 7s ease-in-out infinite}
.cvbody{position:relative;z-index:1;margin-top:20px}
.cveyebrow{animation:rise .5s var(--ease) both}
.cvtitle{animation:typeIn .9s .1s var(--ease) both}
.cvsub{animation:rise .5s .35s var(--ease) both}.cvline{animation:rise .5s .45s var(--ease) both}
.cvstats{display:flex;gap:28px;margin:22px 0 6px;animation:rise .5s .5s var(--ease) both}
.cvstats b{display:block;font-family:var(--head);font-size:clamp(34px,5vw,56px);line-height:1;color:#fff}
.cvstats span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#39A0FF}
.pcards{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:34px;max-width:1080px}
.pcard{display:block;text-decoration:none;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(57,160,255,.35);padding:16px 18px;overflow:hidden;animation:rise .5s var(--ease) both;transition:transform .25s var(--ease),background .25s,border-color .25s}
.pcard:nth-child(2){animation-delay:.6s}.pcard:nth-child(1){animation-delay:.55s}.pcard:nth-child(3){animation-delay:.65s}.pcard:nth-child(4){animation-delay:.7s}.pcard:nth-child(5){animation-delay:.75s}.pcard:nth-child(6){animation-delay:.8s}
.pcard:hover{transform:translateY(-4px);background:rgba(57,160,255,.16);border-color:#39A0FF}
.pcard b{display:block;font-family:var(--head);text-transform:uppercase;font-size:17px;letter-spacing:.03em}
.pcard span{display:block;font-size:12.5px;color:#A9C8FF;margin-top:4px}
.pcard::after{content:'→';position:absolute;right:16px;top:14px;color:#39A0FF;transition:transform .25s var(--ease)}
.pcard:hover::after{transform:translateX(4px)}
.cvfoot{z-index:1}

/* drawer y chat con movimiento */
.ditem{transition:background .15s,padding-left .2s,border-color .2s}.ditem:hover{padding-left:18px}
#chFab{transition:transform .25s var(--ease),background .2s}#chFab:hover{transform:scale(1.08)}
#chFab:not(.on){animation:pulse 2.4s 1.5s 3}
#chPanel{animation:rise .3s var(--ease) both}
.toast{animation:rise .3s var(--ease) both}
.modal .box{animation:pop .35s var(--ease) both}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes grow{from{width:0}}
@keyframes floatA{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-14px,18px) rotate(12deg)}}
@keyframes floatB{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(18px,-12px) rotate(-16deg)}}
@keyframes spinIn{from{transform:rotate(-90deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(57,160,255,.7)}100%{box-shadow:0 0 0 14px rgba(57,160,255,0)}}
@keyframes drift{from{background-position:0 0}to{background-position:120px 104px}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes typeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes glowBorder{0%,100%{border-color:rgba(255,255,255,.5)}50%{border-color:#39A0FF}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* portada: barra no fija (transparente sobre la portada) y portada a todo el ancho */
body.is-portada{padding-bottom:0}
body.is-portada .topbar{position:absolute;left:0;right:0;top:0;background:transparent;border-bottom-color:transparent;margin:0}
body.is-portada .brand{display:none}
body.is-portada .cvlogo{top:clamp(92px,10vw,124px)}
body.is-portada .wrap{max-width:none;padding:0}
body.is-portada .cover{margin:0;min-height:100vh;padding-top:clamp(150px,14vw,190px)}
